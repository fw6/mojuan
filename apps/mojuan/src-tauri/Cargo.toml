[package]
name = "mojuan"
version = "1.6.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mojuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-mcp-bridge = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
mojuan-core = { path = "../../../crates/mojuan-core" }
tauri-plugin-mojuan-render = { path = "../../../crates/tauri-plugin-mojuan-render" }
tauri-plugin-mojuan-update = { path = "../../../crates/tauri-plugin-mojuan-update" }
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["time", "net", "rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
http-body-util = "0.1"

