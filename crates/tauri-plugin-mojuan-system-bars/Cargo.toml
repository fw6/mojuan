[package]
name = "tauri-plugin-mojuan-system-bars"
version = "0.1.0"
description = "mojuan 移动端系统栏（状态栏与导航栏的显隐、图标明暗与安全区）"
authors = ["you"]
edition = "2021"
links = "tauri-plugin-mojuan-system-bars"

[lib]
name = "tauri_plugin_mojuan_system_bars"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
