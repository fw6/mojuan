  <h1 class="subj">跳槽日志</h1>
  <span class="author">Woo Si-mok<a href="//www.dongmanmanhua.cn/search?searchMode=AUTHOR&amp;keyword=Woo Si-mok" class="ico_search2 _scriptSearch" title="作家信息">作家信息</a></span>

<p class="summary">
  社恐打工人撞破危险秘密<br/>这份工作开始变得不对劲了<br/><br/>在创业公司工作的两名员工，一位外向耀眼、能力出众，另一位存在感稀薄、社交恐惧、习惯独自吃饭。这样的两人被分到同一团队，座位还紧挨在一起。成为同组的第一天，后者无意中在同事的显示器上看见了绝不能看到的东西。从那一刻起，原本平静的公司生活开始彻底走向失控。
</p>
