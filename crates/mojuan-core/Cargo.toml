[package]
name = "mojuan-core"
version = "1.6.3"
edition = "2021"

[lib]
name = "mojuan_core"
crate-type = ["rlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
rquickjs = { version = "0.12.2", features = ["bindgen"] }
