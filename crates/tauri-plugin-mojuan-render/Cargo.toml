[package]
name = "tauri-plugin-mojuan-render"
version = "0.1.0"
description = "mojuan 移动端隐藏 webview 渲染通道（Android WebView / iOS WKWebView 离屏加载受防护源页面并取回渲染后 HTML）"
authors = ["you"]
edition = "2021"
links = "tauri-plugin-mojuan-render"

[lib]
name = "tauri_plugin_mojuan_render"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
mojuan-core = { path = "../mojuan-core" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
