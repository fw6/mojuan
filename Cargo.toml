[workspace]
members = [
    "apps/mojuan/src-tauri",
    "crates/mojuan-core",
    "crates/tauri-plugin-mojuan-render",
    "crates/tauri-plugin-mojuan-system-bars",
    "crates/tauri-plugin-mojuan-update",
]
# 中间结果目录里的第三方 Cargo.toml 不进 workspace：pnpm install 会扫全树并对每个
# Cargo.toml 跑 cargo metadata，排除掉才不会被本机留下的检出卡住整次安装。
exclude = [".scratch"]
resolver = "2"

# 应用版本的事实来源是 apps/mojuan/src-tauri/tauri.conf.json 的 version（Tauri 官方推荐，
# Android 的 versionName/versionCode 与 iOS 的 CFBundleShortVersionString 都从它取）。
# Cargo 读不了 json，所以这里跟一份，apps/mojuan/src-tauri/tests/tauri_config.rs 有一条
# 断言守着两者一致；发布流程用 scripts/app-version.mjs 取。
[workspace.package]
version = "1.6.9"

# 打包体积（Tauri 官方推荐的 release 配置）：strip 去掉符号表，panic=abort 去掉
# unwind 表，lto + codegen-units=1 让跨 crate 内联并消掉无法到达的代码。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
