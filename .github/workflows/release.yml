# 桌面发布（research #9 定案 + wayfinder #26 强化）：tag app-v* 触发 + 手动 dispatch，
# tauri-action@v1 构建 Windows + Linux + macOS（ad-hoc 签名）并发布 release。
# 移动包（wayfinder #31 后）：build-android / build-ios 各自用 tauri CLI 构建并上传
# 到同一 release——Android 出签名直装 APK（固定发布密钥，见下）+ android.json
# 更新清单；iOS 无 Apple 开发者账号，出模拟器 .app（真机 .ipa 需签名，列入后置）。
# 自动更新（wayfinder #26/#27）：桌面走 tauri-plugin-updater（仅 Windows/Linux，
# macOS ad-hoc 无法公证、更新器整包替换会被 Gatekeeper 拦，前端不显示更新入口 +
# capabilities 权限限定），Android 走应用内 OTA（PackageInstaller，见 ota.rs 与
# tauri-plugin-mojuan-update）；签名私钥经 CI secret TAURI_SIGNING_PRIVATE_KEY 注入
#（.env 不生效，必须环境变量）。
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      - name: install frontend dependencies
        working-directory: desktop
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: 'Mojuan v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android 直装 APK：gen/android 按需 init（gitignore，wayfinder #31），
  # rquickjs-sys bindgen 需注入 NDK sysroot（本地核验：缺它 stdio.h 找不到）。
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      - name: install frontend dependencies
        run: npm install

      # cargo fetch：让 tauri/插件源码进入 registry 缓存——tauri android init
      # 生成的 tauri.settings.gradle 引用本地缓存绝对路径，缓存缺失则 init 指向不存在目录。
      - name: fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: install Android NDK
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;29.0.14206865"
          test -d "$ANDROID_HOME/ndk/29.0.14206865"

      - name: init Android project
        run: |
          ln -sf ../node_modules/.bin/tauri src-tauri/tauri
          npx tauri android init --ci
          # 启动图标：init 生成的是 Tauri 模板的默认图（gen/ 不入库，CI 每次现生成），
          # 必须紧接 init 用 tauri icon 覆盖成仓库里的图标（图标源在 src-tauri/icons/）
          npx tauri icon src-tauri/icons/icon.manifest.json
          # 图片代理走 127.0.0.1 明文 HTTP：release 需放行 loopback（research #31 换代理）
          # 脚本对 cwd 不敏感，但用 GITHUB_WORKSPACE 绝对路径避免 working-directory 影响
          bash "$GITHUB_WORKSPACE/scripts/android-netsec.sh"

      - name: build Android APK
        run: |
          # 注意：路径在脚本内由 shell 展开（workflow env: 块不会展开 $ANDROID_HOME）
          NDK_SYSROOT="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/aarch64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/arm-linux-androideabi"
          export BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/i686-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/x86_64-linux-android"
          npx tauri android build --apk --ci

      # release APK 默认未签名，Android 无法直装，必须签名。用固定的发布密钥（secret
      # ANDROID_KEYSTORE_BASE64）：Android 只允许同签名的包覆盖安装，每次现生成密钥会
      # 让 OTA 永远装不上。密钥生成与 secret 配置见 updater/README.md。
      - name: sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "缺 secret ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mojuan-release.keystore
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" sign \
            --ks mojuan-release.keystore \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "mojuan-$VERSION-android.apk" \
            "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          rm -f mojuan-release.keystore
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # 客户端（src-tauri 的 ota 模块）要的清单：版本 + APK 的 sha256 + APK 文件名。
      # Worker 的 /android.json 读到它，把文件名改写成自己的下载路径后对外提供。
      - name: write Android update manifest
        run: |
          SHA="$(sha256sum "mojuan-$APP_VERSION-android.apk" | cut -d' ' -f1)"
          printf '{"version":"%s","url":"mojuan-%s-android.apk","sha256":"%s"}\n' \
            "$APP_VERSION" "$APP_VERSION" "$SHA" > android.json
          cat android.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: Mojuan v${{ env.APP_VERSION }}
          draft: false
          files: |
            desktop/mojuan-${{ env.APP_VERSION }}-android.apk
            desktop/android.json

  # iOS 模拟器 .app：真机 .ipa 需 Apple 开发者签名（项目暂无，与桌面 ad-hoc 同思路后置），
  # 先出可装进模拟器的 aarch64-sim 包（ditto 打包保留权限/符号链接）。
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: install Rust with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      - name: install frontend dependencies
        run: npm install

      - name: fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      # macos runner 镜像未预装 xcodegen（tauri ios init 依赖），缺失时补装
      - name: install XcodeGen
        run: |
          which xcodegen || brew install xcodegen

      - name: init iOS project
        run: |
          ln -sf ../node_modules/.bin/tauri src-tauri/tauri
          npx tauri ios init --ci
          # 启动图标：init 生成的是 Tauri 模板的默认图（gen/ 不入库，CI 每次现生成），
          # 必须紧接 init 用 tauri icon 覆盖成仓库里的图标（图标源在 src-tauri/icons/）
          npx tauri icon src-tauri/icons/icon.manifest.json

      - name: build iOS simulator app
        run: npx tauri ios build --target aarch64-sim --ci

      # .app 的名字取自 productName（tauri.ios.conf.json 是「墨卷」），这里按产物目录里的
      # 实际名字打包，zip 自身保持 ASCII 名（制品地址要进 release 与更新清单）。
      - name: package .app bundle
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          APP="$(ls -d src-tauri/gen/apple/build/arm64-sim/*.app)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "mojuan-$VERSION-ios-simulator.app.zip"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: Mojuan v${{ env.APP_VERSION }}
          draft: false
          files: desktop/mojuan-${{ env.APP_VERSION }}-ios-simulator.app.zip
