# 桌面发布（research #9 定案 + wayfinder #26 强化）：在 master 上手动 dispatch，
# tauri-action@v1 构建 Windows + Linux + macOS（ad-hoc 签名）并发布 release，
# tag（app-v<版本>）与 release 由 action 按 tauri.conf.json 里的版本号现创建。
#
# 触发方式是 master 上的手动 dispatch：GitHub 的缓存按 ref 隔离，tag 运行读不到别的
# tag 存下的缓存（实测 1.6.4 的 Android 作业对 1.6.3 存下的 1 GB 缓存报 No cache
# found），而 master 上的运行彼此共用一个作用域，历次发布之间能复用编译产物。
# dispatch 时可选分支，guard 作业挡住非 master 的 ref。
# 移动包（wayfinder #31 后）：build-android / build-ios 各自用 tauri CLI 构建并上传
# 到同一 release——Android 出签名直装 APK（固定发布密钥，见下）+ android.json
# 更新清单；iOS 无 Apple 开发者账号，出模拟器 .app（真机 .ipa 需签名，列入后置）。
# 自动更新（wayfinder #26/#27）：桌面走 tauri-plugin-updater（仅 Windows/Linux，
# macOS ad-hoc 无法公证、更新器整包替换会被 Gatekeeper 拦，前端不显示更新入口 +
# capabilities 权限限定），Android 走应用内 OTA（PackageInstaller，见 ota.rs 与
# tauri-plugin-mojuan-update）；签名私钥经 CI secret TAURI_SIGNING_PRIVATE_KEY 注入
#（.env 不生效，必须环境变量）。
# 发布产物统一写在仓库根的 build/（被忽略，不进任何源码目录）。
name: release

on:
  workflow_dispatch:

jobs:
  # 发布只能从 master 发起：dispatch 可以选分支，选错会把这个分支的代码发成
  # app-v<版本> 的正式版本，缓存的复用也依赖 master 这个作用域。
  guard:
    runs-on: ubuntu-22.04
    steps:
      - name: 确认在 master 上
        run: |
          test "${GITHUB_REF}" = "refs/heads/master" || {
            echo "发布必须在 master 上 dispatch，当前是 ${GITHUB_REF}" >&2
            exit 1
          }

  publish-tauri:
    needs: guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # pnpm 版本取自 package.json 的 packageManager；必须在 setup-node 之前（cache: pnpm 要用到它）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 缓存键的一代前缀，改这里可以让所有旧条目整体失效。
          prefix-key: v1-rust
          # pnpm 把 crate 归档成目录源放在仓库根内的 .pnpm/crates，依赖的 manifest
          # 路径因此落在仓库根之下；rust-cache 用「manifest 在不在工作区根之下」
          # 区分工作区成员与第三方依赖，根取仓库根会把全部依赖当成工作区成员从
          # target 里删掉。根取 apps/mojuan、目标目录仍指回仓库根的 target。
          workspaces: apps/mojuan -> ../../target
          # macOS 的两个矩阵项共用同一个 job id，键里带上 target 才不会互相覆盖。
          key: ${{ matrix.args }}

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/mojuan
          tagName: app-v__VERSION__
          releaseName: 'Mojuan v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android 直装 APK：gen/android 按需 init（gitignore，wayfinder #31），
  # rquickjs-sys bindgen 需注入 NDK sysroot（本地核验：缺它 stdio.h 找不到）。
  # 只出 arm64-v8a：tauri android build 对每个 ABI 各编译一遍 Rust 代码，多一个 ABI
  # 就多一遍全量编译（四个 ABI 时这一步约 13 分钟，单 ABI 约 4 分钟）。
  build-android:
    runs-on: ubuntu-22.04
    needs: guard
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mojuan
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 缓存键的一代前缀，改这里可以让所有旧条目整体失效。
          prefix-key: v1-rust
          # pnpm 把 crate 归档成目录源放在仓库根内的 .pnpm/crates，依赖的 manifest
          # 路径因此落在仓库根之下；rust-cache 用「manifest 在不在工作区根之下」
          # 区分工作区成员与第三方依赖，根取仓库根会把全部依赖当成工作区成员从
          # target 里删掉。根取 apps/mojuan、目标目录仍指回仓库根的 target。
          workspaces: apps/mojuan -> ../../target

      # Gradle 的发行包与依赖：gen/android 不入库，wrapper 每次现生成，没有这份
      # 缓存就要重下 gradle-8.14.3-bin.zip 与 AGP/Kotlin 的依赖。只缓存下载来的
      # 东西（wrapper 的发行包 + modules-2 里的制品），配置缓存与 transform 的
      # 产物留在当次运行里，不跨运行复用。
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      # 安装走 workspace 根，其余步骤在 app 目录
      - name: install frontend dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # cargo fetch：让 tauri/插件源码进入 registry 缓存——tauri android init
      # 生成的 tauri.settings.gradle 引用本地缓存绝对路径，缓存缺失则 init 指向不存在目录。
      - name: fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: install Android NDK
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;29.0.14206865"
          test -d "$ANDROID_HOME/ndk/29.0.14206865"

      - name: init Android project
        run: |
          ln -sf ../node_modules/.bin/tauri src-tauri/tauri
          pnpm exec tauri android init --ci
          # 启动图标：init 生成的是 Tauri 模板的默认图（gen/ 不入库，CI 每次现生成），
          # 必须紧接 init 用 tauri icon 覆盖成仓库里的图标（图标源在 src-tauri/icons/）
          pnpm exec tauri icon src-tauri/icons/icon.manifest.json
          # 图片代理走 127.0.0.1 明文 HTTP：release 需放行 loopback（research #31 换代理）
          # 脚本基于自身位置定位 app 目录，对 cwd 不敏感
          bash "$GITHUB_WORKSPACE/scripts/android-netsec.sh"

      - name: build Android APK
        run: |
          # 注意：路径在脚本内由 shell 展开（workflow env: 块不会展开 $ANDROID_HOME）
          NDK_SYSROOT="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK_SYSROOT -I$NDK_SYSROOT/usr/include/aarch64-linux-android"
          pnpm exec tauri android build --apk --ci --target aarch64

      # release APK 默认未签名，Android 无法直装，必须签名。用固定的发布密钥（secret
      # ANDROID_KEYSTORE_BASE64）：Android 只允许同签名的包覆盖安装，每次现生成密钥会
      # 让 OTA 永远装不上。密钥生成与 secret 配置见 apps/updater/README.md。
      - name: sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "缺 secret ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          OUT="$GITHUB_WORKSPACE/build"
          mkdir -p "$OUT"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$OUT/mojuan-release.keystore"
          VERSION="$(node "$GITHUB_WORKSPACE/scripts/app-version.mjs")"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" sign \
            --ks "$OUT/mojuan-release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT/mojuan-$VERSION-android.apk" \
            "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          rm -f "$OUT/mojuan-release.keystore"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # 客户端（src-tauri 的 ota 模块）要的清单：版本 + APK 的 sha256 + APK 文件名。
      # Worker 的 /android.json 读到它，把文件名改写成自己的下载路径后对外提供。
      - name: write Android update manifest
        run: |
          OUT="$GITHUB_WORKSPACE/build"
          SHA="$(sha256sum "$OUT/mojuan-$APP_VERSION-android.apk" | cut -d' ' -f1)"
          printf '{"version":"%s","url":"mojuan-%s-android.apk","sha256":"%s"}\n' \
            "$APP_VERSION" "$APP_VERSION" "$SHA" > "$OUT/android.json"
          cat "$OUT/android.json"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: Mojuan v${{ env.APP_VERSION }}
          draft: false
          files: |
            build/mojuan-${{ env.APP_VERSION }}-android.apk
            build/android.json

  # iOS 模拟器 .app：真机 .ipa 需 Apple 开发者签名（项目暂无，与桌面 ad-hoc 同思路后置），
  # 先出可装进模拟器的 aarch64-sim 包（ditto 打包保留权限/符号链接）。
  build-ios:
    runs-on: macos-latest
    needs: guard
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mojuan
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 缓存键的一代前缀，改这里可以让所有旧条目整体失效。
          prefix-key: v1-rust
          # pnpm 把 crate 归档成目录源放在仓库根内的 .pnpm/crates，依赖的 manifest
          # 路径因此落在仓库根之下；rust-cache 用「manifest 在不在工作区根之下」
          # 区分工作区成员与第三方依赖，根取仓库根会把全部依赖当成工作区成员从
          # target 里删掉。根取 apps/mojuan、目标目录仍指回仓库根的 target。
          workspaces: apps/mojuan -> ../../target

      # 安装走 workspace 根，其余步骤在 app 目录
      - name: install frontend dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      # macos runner 镜像未预装 xcodegen（tauri ios init 依赖），缺失时补装
      - name: install XcodeGen
        run: |
          which xcodegen || brew install xcodegen

      - name: init iOS project
        run: |
          ln -sf ../node_modules/.bin/tauri src-tauri/tauri
          pnpm exec tauri ios init --ci
          # 启动图标：init 生成的是 Tauri 模板的默认图（gen/ 不入库，CI 每次现生成），
          # 必须紧接 init 用 tauri icon 覆盖成仓库里的图标（图标源在 src-tauri/icons/）
          pnpm exec tauri icon src-tauri/icons/icon.manifest.json

      - name: build iOS simulator app
        run: pnpm exec tauri ios build --target aarch64-sim --ci

      # .app 的名字取自 productName（tauri.ios.conf.json 是「墨卷」），这里按产物目录里的
      # 实际名字打包，zip 自身保持 ASCII 名（制品地址要进 release 与更新清单）。
      - name: package .app bundle
        run: |
          OUT="$GITHUB_WORKSPACE/build"
          mkdir -p "$OUT"
          VERSION="$(node "$GITHUB_WORKSPACE/scripts/app-version.mjs")"
          APP="$(ls -d src-tauri/gen/apple/build/arm64-sim/*.app)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/mojuan-$VERSION-ios-simulator.app.zip"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: Mojuan v${{ env.APP_VERSION }}
          draft: false
          files: build/mojuan-${{ env.APP_VERSION }}-ios-simulator.app.zip
